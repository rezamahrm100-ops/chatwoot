name: chatwoot-store

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/vps/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 15

  rails:
    image: chatwoot/chatwoot:v4.19.1-ce
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  sidekiq:
    image: chatwoot/chatwoot:v4.19.1-ce
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  telegram-unified-bot:
    profiles: ["bot"]
    build:
      context: ../../integrations/telegram-unified-bot
    restart: unless-stopped
    env_file: .env.bot
    environment:
      CHATWOOT_BASE_URL: http://rails:3000
      PORT: "8080"
    depends_on:
      - rails

  caddy:
    profiles: ["public"]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      CHATWOOT_DOMAIN: ${CHATWOOT_DOMAIN:?Set CHATWOOT_DOMAIN}
      BOT_DOMAIN: ${BOT_DOMAIN:?Set BOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rails

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
